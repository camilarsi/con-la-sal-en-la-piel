<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Con la Sal en la Piel — Web Doc Interactivo</title>
  <meta name="description" content="Web Doc Interactivo. Artivismo en el Atlanticazo. Mar del Plata." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===================== PANTALLA PRINCIPAL ===================== -->
  <main class="screen">

    <!-- Fondo fotográfico -->
    <div
      class="screen__bg"
      style="background-image: url('assets/backgrounds/home.png');"
    ></div>

    <!-- Contenido -->
    <div class="screen__content">
      <div class="home__inner">

        <!-- Columna 1: Logo / Título -->
        <div class="home__left">
          <img
            src="assets/branding/con-la-sal-en-la-piel-logo.png"
            alt="Con la Sal en la Piel — Web Doc Interactivo — Artivismo en el Atlanticazo"
            class="home__logo"
          />
        </div>

        <!-- Columna 2: Links -->
        <div class="home__center">
          <nav class="home__nav">
            <a href="sobre.html" class="home__nav-link">
              Mar del Plata <span class="arrow">›</span>
            </a>
            <a href="archivo-vivo.html" class="home__nav-link" style="max-width:280px; line-height:1.2;">
              Suma tu<br>comunidad<br>costera <span class="arrow" style="align-self:flex-end;">›</span>
            </a>
          </nav>
        </div>

        <!-- Columna 3: Video -->
        <div class="home__right">
          <div class="home__video-card" onclick="window.open('https://youtu.be/lUQ6kiCW4do','_blank')">
            <img
              src="assets/home/video-thumb.png"
              alt="Video: Con la Sal en la Piel — Piloto"
            />
            <div class="play-btn">
              <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
                <circle cx="40" cy="40" r="40" fill="rgba(0,0,0,0.35)"/>
                <polygon points="30,20 62,40 30,60" fill="white"/>
              </svg>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Botones sociales flotantes -->
    <div class="social-floating">
      <a href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram">
        <img src="assets/social/instagram.png" alt="Instagram" />
      </a>
      <a href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="Facebook">
        <img src="assets/social/facebook.png" alt="Facebook" />
      </a>
      <a href="https://www.tiktok.com/" target="_blank" rel="noopener" aria-label="TikTok">
        <img src="assets/social/tiktok.png" alt="TikTok" />
      </a>
      <a href="#" target="_blank" rel="noopener" aria-label="No al Extractivismo">
        <img src="assets/social/no-extractivismo.png" alt="No al extractivismo" />
      </a>
    </div>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
