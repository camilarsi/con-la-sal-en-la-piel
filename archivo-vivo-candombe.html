<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archivo Vivo — Candombe — Con la Sal en la Piel</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="has-bottom-nav">

  <main class="screen">

    <!-- Fondo fotográfico -->
    <div
      class="screen__bg screen__bg--dark"
      style="background-image: url('assets/backgrounds/archivo-candombe.png'); background-position: center top;"
    ></div>

    <!-- Logo esquina superior derecha -->
    <a href="index.html" class="logo-corner" aria-label="Volver al inicio">
      <img
        src="assets/branding/con-la-sal-en-la-piel-logo.png"
        alt="Con la Sal en la Piel — Web Doc Interactivo — Artivismo en el Atlanticazo"
      />
    </a>

    <!-- Contenido principal -->
    <div class="screen__content">
      <div class="archive-detail__inner">

        <!-- Sidebar izquierdo: título + nav de la categoría -->
        <aside class="archive-detail__left">
          <h2 class="archive-detail__section">Archivo Vivo</h2>
          <p class="archive-detail__cat">Candombe</p>
          <nav class="archive-detail__nav">
            <a href="#fotografia" class="archive-detail__nav-link">
              Fotografía <span>›</span>
            </a>
            <a href="#videos" class="archive-detail__nav-link">
              Videos <span>›</span>
            </a>
            <a href="#crear" class="archive-detail__nav-link">
              Crear Categoría <span>›</span>
            </a>
          </nav>
        </aside>

        <!-- Columna principal: visualizador grande arriba, carrusel debajo -->
        <div class="archive-detail__main">

          <!-- Visualizador (imagen destacada grande) -->
          <div class="archive-detail__featured">
            <img
              id="featured-img"
              src="assets/archivo-vivo-candombe/archivo-vivo-candombe-1.png"
              alt="Candombe — Archivo Vivo"
            />
          </div>

          <!-- Carrusel inferior: thumbs navegables con flechas -->
          <div class="archive-gallery" id="archivo-candombe-gallery">
            <button class="archive-gallery__btn" data-dir="-1" aria-label="Anterior">‹</button>
            <div class="archive-gallery__track">
              <button type="button" class="archive-gallery__thumb is-active" aria-label="Registro 1">
                <img src="assets/archivo-vivo-candombe/archivo-vivo-candombe-1.png" alt="" />
              </button>
              <button type="button" class="archive-gallery__thumb" aria-label="Registro 2">
                <img src="assets/archivo-vivo-candombe/archivo-vivo-candombe-1.png" alt="" />
              </button>
              <button type="button" class="archive-gallery__thumb" aria-label="Registro 3">
                <img src="assets/archivo-vivo-candombe/archivo-vivo-candombe-1.png" alt="" />
              </button>
              <button type="button" class="archive-gallery__thumb" aria-label="Registro 4">
                <img src="assets/archivo-vivo-candombe/archivo-vivo-candombe-1.png" alt="" />
              </button>
            </div>
            <button class="archive-gallery__btn" data-dir="1" aria-label="Siguiente">›</button>
          </div>

        </div>

      </div>
    </div>

    <!-- Barra de navegación inferior -->
    <nav class="bottom-nav">
      <div class="bottom-nav__left">
        <a href="serie.html">Serie <span>›</span></a>
        <a href="archivo-vivo.html">Archivo Vivo ¿Te Sumás? <span>›</span></a>
      </div>
    </nav>

    <!-- Botones sociales flotantes -->
    <div class="social-floating">
      <a href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram">
        <img src="assets/social/instagram.png" alt="Instagram" />
      </a>
      <a href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="Facebook">
        <img src="assets/social/facebook.png" alt="Facebook" />
      </a>
      <a href="https://www.tiktok.com/" target="_blank" rel="noopener" aria-label="TikTok">
        <img src="assets/social/tiktok.png" alt="TikTok" />
      </a>
      <a href="#" target="_blank" rel="noopener" aria-label="No al Extractivismo">
        <img src="assets/social/no-extractivismo.png" alt="No al extractivismo" />
      </a>
    </div>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
